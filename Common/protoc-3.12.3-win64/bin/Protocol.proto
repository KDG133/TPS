syntax = "proto3";

package Protocol;
import "google/protobuf/timestamp.proto";
option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  S_ENTER_GAME = 0;
  S_LEAVE_GAME = 1;
  S_SPAWN = 2;
  S_DESPAWN = 3;
  C_MOVE = 4;
  S_MOVE = 5;
  C_AIM = 6;
  S_AIM = 7;
  C_RELOAD = 8;
  S_RELOAD = 9;
  C_WEAPONCHANGE = 10;
  S_WEAPONCHANGE = 11;
  C_SHOT = 12;
  S_SHOT = 13;
  C_CHAT = 14;
  S_CHAT = 15;
}

enum GunType { AR = 0; SG = 1; SMG = 2; END = 3; }

message S_EnterGame {
  PlayerInfo player = 1;
}

message S_LeaveGame{

}

message S_Spawn{
	repeated PlayerInfo players = 1;
}

message S_Despawn{
	repeated int32 playerIds = 1;
}

message C_Move{
	PositionInfo posInfo = 1;
}

message S_Move{
	int32 playerID = 1;
	PositionInfo posInfo = 2;
}

message C_Aim{
	bool isAim = 1;
	PVector3 pos = 2;
}

message S_Aim{
	int32 playerID = 1;
	bool isAim = 2;
	PVector3 pos = 3;
}

message C_Weaponchange{
	GunType gunType = 1;
}

message S_Weaponchange{
	int32 playerID = 1;
	GunType gunType = 2;
}

message C_Reload{
	bool isReload = 1;
}

message S_Reload{
	int32 playerID = 1;
	bool isReload = 2;
}

message C_Shot{
	bool isShot = 1;
}

message S_Shot{
	int32 playerID = 1;
	bool isShot = 2;
}

message C_Chat {
  string context = 1;
}

message S_Chat {
  string context = 1;
}

message PVector3 {
	float x = 1;
	float y = 2;
	float z = 3;
}

message PVector4 {
	float x = 1;
	float y = 2;
	float z = 3;
	float w = 4;
}

message PlayerInfo {
	int32 playerID = 1;
	string name = 2;
	bool isAim = 3;
	PositionInfo posInfo = 4;
}

message PositionInfo {
	float moveDir = 1;
	float moveSpeed = 2;
	PVector3 pos = 3;
}
