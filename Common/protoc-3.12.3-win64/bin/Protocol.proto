syntax = "proto3";

package Protocol;
import "google/protobuf/timestamp.proto";
option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
  S_ENTER_GAME = 0;
  S_LEAVE_GAME = 1;
  S_SPAWN = 2;
  S_DESPAWN = 3;
  C_MOVE = 4;
  S_MOVE = 5;
  C_CHAT = 6;
  S_CHAT = 7;
}

message S_EnterGame {
  PlayerInfo player = 1;
}

message S_LeaveGame{

}

message S_Spawn{
	repeated PlayerInfo players = 1;
}

message S_Despawn{
	repeated int32 playerIds = 1;
}

message C_Move{
	float posX = 1;
	float poxY = 2;
	float poxZ = 3;
}

message S_Move{
	int32 playerID = 1;
	float posX = 2;
	float poxY = 3;
	float poxZ = 4;
}

message C_Chat {
  string context = 1;
}

message S_Chat {
  string context = 1;
}

message PlayerInfo{
	int32 playerID = 1;
	string name = 2;
	float posX = 3;
	float poxY = 4;
	float poxZ = 5;
}
